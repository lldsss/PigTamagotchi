[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pig-tamagotchi"
version = "0.1.0"
description = "Telegram Mini App с тамагочи-свинкой на aiogram"
requires-python = ">=3.11"
dependencies = ["aiogram>=3.22,<4", "aiohttp>=3.12,<4", "python-dotenv>=1.1,<2"]

[project.optional-dependencies]
dev = ["ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
